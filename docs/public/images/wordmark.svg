<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280" role="img" aria-labelledby="title desc">
  <title id="title">换台 Huantai</title>
  <desc id="desc">少找窗口，多写代码。Mac 菜单栏里的 AI 会话中枢。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d162a"/><stop offset="1" stop-color="#11111b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#42b7ff"/><stop offset="1" stop-color="#9074ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#315dc0" stop-opacity=".35"/><stop offset="1" stop-color="#315dc0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1120" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1120" height="280" rx="24" fill="url(#grid)"/>
  <ellipse cx="170" cy="100" rx="320" ry="220" fill="url(#halo)"/>
  <rect x="62" y="77" width="112" height="112" rx="28" fill="url(#accent)"/>
  <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linejoin="round"><rect x="86" y="102" width="49" height="40" rx="6"/><rect x="103" y="119" width="49" height="40" rx="6" fill="#638ffb"/></g>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans SC,sans-serif">
    <text x="210" y="129" fill="#f5f8ff" font-size="50" font-weight="750">换台 <tspan fill="#95a9cc" font-size="28" font-weight="500">/ Huantai</tspan></text>
    <text x="212" y="178" fill="#e0e9fb" font-size="24" font-weight="550">少找窗口，多写代码。</text>
    <text x="212" y="215" fill="#8293b2" font-size="15" letter-spacing="1.3">AI SESSIONS, ONE MENU BAR.</text>
  </g>
  <g transform="translate(870 78)">
    <circle cx="55" cy="55" r="42" fill="none" stroke="#263049" stroke-width="8"/>
    <circle cx="55" cy="55" r="42" fill="none" stroke="#33d879" stroke-width="8" stroke-linecap="round" stroke-dasharray="174 264" transform="rotate(-90 55 55)"/>
    <circle cx="22" cy="90" r="5" fill="#57a7ff"/>
    <path d="M106 94h42m-24-18 24 18-24 18" fill="none" stroke="#8396bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="55" y="63" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" fill="#f5f8ff" font-size="23" font-weight="600">ht</text>
    <text x="55" y="145" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,sans-serif" fill="#8293b2" font-size="12">READY TO SWITCH</text>
  </g>
</svg>
